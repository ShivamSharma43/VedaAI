version: "3.9"
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: ./server
    env_file: ./server/.env
    ports: ["4000:4000"]
    depends_on: [mongo, redis]

  web:
    build: ./client
    env_file: ./client/.env.local
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  mongo_data: